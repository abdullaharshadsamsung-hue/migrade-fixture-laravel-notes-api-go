services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://app:app@postgres:5432/app?sslmode=disable"
      DB_HOST: "postgres"
      DB_NAME: "app"
      DB_PASSWORD: "app"
      DB_PORT: "5432"
      DB_USER: "app"
      DB_USERNAME: "app"
      JWT_SECRET: "test-secret"
      PORT: "8080"
      POSTGRES_URL: "postgres://app:app@postgres:5432/app?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "app"
      POSTGRES_PASSWORD: "app"
      POSTGRES_DB: "app"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
